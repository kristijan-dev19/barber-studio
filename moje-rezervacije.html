<!DOCTYPE html>
<html lang="sr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Moje rezervacije - Barber Studio</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
Barber Studio
</div>


<nav>

<a href="index.html">Početna</a>
<a href="cenovnik.html">Cenovnik</a>
<a href="galerija.html">Galerija</a>
<a href="rezervacija.html">Rezervacija</a>
<a href="moje-rezervacije.html">Moje rezervacije</a>
<a href="kontakt.html">Kontakt</a>

</nav>

</header>



<section class="my-reservation">

<h1>
Moja rezervacija
</h1>


<div id="reservationContainer"></div>


</section>



<footer>

<p>
© 2026 Barber Studio | Telefon: 060/000-0000
</p>

</footer>



<script>

let reservation =
JSON.parse(localStorage.getItem("barberReservation"));


let container =
document.getElementById("reservationContainer");


if(!reservation){

    container.innerHTML = `

        <div class="no-reservation">

            <h2>
                Nemate rezervaciju
            </h2>

            <p>
                Trenutno nemate zakazan termin.
            </p>

            <a
                href="rezervacija.html"
                class="my-reservation-button"
            >
                Zakaži termin
            </a>

        </div>

    `;

}

else{

    container.innerHTML = `

        <div class="my-reservation-card">

            <h2>
                Vaš termin
            </h2>


            <div class="my-reservation-item">

                <span>
                    Ime i prezime
                </span>

                <strong>
                    ${reservation.name}
                </strong>

            </div>


            <div class="my-reservation-item">

                <span>
                    Telefon
                </span>

                <strong>
                    ${reservation.phone}
                </strong>

            </div>


            <div class="my-reservation-item">

                <span>
                    Usluga
                </span>

                <strong>
                    ${reservation.service}
                </strong>

            </div>


            <div class="my-reservation-item">

                <span>
                    Datum
                </span>

                <strong>
                    ${reservation.date}
                </strong>

            </div>


            <div class="my-reservation-item">

                <span>
                    Vreme
                </span>

                <strong class="my-reservation-time">
                    ${reservation.time}
                </strong>

            </div>


            <div class="my-reservation-status">
                ${reservation.status}
            </div>


            <a
                href="rezervacija.html"
                class="my-reservation-button"
            >
                Nova rezervacija
            </a>

        </div>

    `;

}

</script>


</body>
</html>
